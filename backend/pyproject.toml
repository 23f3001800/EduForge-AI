[project]
name = "eduforge"
version = "0.1.0"
description = "EduForge AI — turns raw educational documents into classroom-ready Teacher Knowledge Packages"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
# Kept as extras so M0 (contracts) installs with almost nothing. Downstream
# modules add only what they own; `contracts` must never gain a heavy dep.
platform_deps = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "structlog>=24.4",
    "prometheus-client>=0.21",
]
llm = [
    "anthropic>=0.40",
    "langgraph>=0.2",
    # Both are imported lazily, inside the adapter that needs them, so a missing
    # one costs nothing until that provider is actually selected. That is also
    # why their absence here went unnoticed: the suite never constructs a real
    # adapter, so it stayed green while a production image would have booted,
    # passed /healthz, and then died with ModuleNotFoundError on the first job.
    # `openai` backs the OpenRouter adapter — the default production provider.
    "openai>=2.0",
    "google-genai>=1.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
]
parsing = [
    "pypdf>=5.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    # Page-level text/image profiling and rasterisation for OCR routing.
    # Self-contained wheels; no system packages, which is what keeps stage 1
    # buildable in the same container as everything else.
    "pymupdf>=1.24",
]
ocr = [
    # The default recogniser. An engine is a port (stages/s1_document_intelligence
    # /ocr), so this extra is the only thing tying the deployment to Azure -
    # OCR_ENGINE=tesseract or =easyocr swaps it without touching code.
    "azure-ai-documentintelligence>=1.0",
]
render = [
    # Pure-Python PDF generation — no wkhtmltopdf, no LaTeX, no system packages,
    # which is what makes stage 10 buildable in the same container as
    # everything else. `NotoSans`/`NotoSansDevanagari` (shipped under
    # `stages/s10_publishing/render/fonts/`) are registered directly against
    # this, which is also why `jinja2` here was never taken up: stage 10
    # builds pages with fpdf2's own layout primitives, not HTML+CSS.
    "fpdf2>=2.8",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.7",
    "import-linter>=2.1",
    # `render` is a runtime extra, but the unit suite exercises stage 10's PDF
    # output directly, so `pip install -e backend[dev]` must pull it too.
    "eduforge[render]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts", "core", "stages", "orchestration", "worker", "api", "pedagogy"]

# ---------------------------------------------------------------- tooling ---

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

# FastAPI's dependency injection is expressed as function calls in argument
# defaults. That is the framework's documented idiom, not the mutable-default bug
# B008 exists to catch, so the DI markers are declared immutable rather than
# suppressed case by case.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on private/internal shapes and use fixtures freely.
"tests/**" = ["S101"]
# Mathematical notation is the subject matter here, not a typo. RUF001/2/3 flag
# Greek letters and operators as "ambiguous unicode", which is exactly the
# content these modules exist to recognise and convert.
"stages/s1_document_intelligence/equations.py" = ["RUF001", "RUF002", "RUF003"]
# The en-dash in _LIST_MARKERS is a real bullet character found in real documents,
# not a mistyped hyphen — replacing it would stop detecting those list items.
"stages/s1_document_intelligence/parsers.py" = ["RUF001"]
# The smart-quote and dash mappings ARE the data: this table exists to fold
# those exact characters, which PDF extraction produces constantly.
"stages/s3_knowledge/grounding.py" = ["RUF001"]
# N818 wants an Error suffix. These are domain rejections and read better without
# one at the raise site (`raise DocumentTooLarge(...)`), and "ParseFailureError"
# is strictly worse than "ParseFailure". All inherit IngestionError, so the
# hierarchy is unambiguous.
"stages/s1_document_intelligence/errors.py" = ["N818"]
# Same reasoning for the LLM layer: `raise ContentRefused(...)` and
# `raise BudgetExhausted(...)` read as the conditions they describe, and the
# Error-suffixed alternatives are strictly worse names.
"core/llm/base.py" = ["N818"]
"core/llm/client.py" = ["N818"]
"core/llm/providers/replay_provider.py" = ["N818"]
"tests/unit/test_document_intelligence.py" = ["RUF001", "RUF002", "RUF003"]
"tests/fixtures/documents/generate.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# --------------------------------------------------------------------------
# Import boundaries — this is what lets 9 agents build in parallel (docs/07).
# A stage importing another stage fails CI.
# --------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["contracts", "core", "pedagogy", "stages", "orchestration", "worker", "api"]

[[tool.importlinter.contracts]]
name = "contracts is a leaf — it may import nothing in-project"
type = "forbidden"
source_modules = ["contracts"]
forbidden_modules = ["core", "pedagogy", "stages", "orchestration", "worker", "api"]

[[tool.importlinter.contracts]]
name = "stages are independent of each other"
type = "independence"
modules = [
    "stages.s1_document_intelligence",
    "stages.s2_classification",
    "stages.s3_knowledge",
    "stages.s4_planner",
    "stages.s5_classroom_content",
    "stages.s6_activities",
    "stages.s7_assessments",
    "stages.s8_gaps",
    "stages.s9_validation",
    "stages.s10_publishing",
]

# `api` sits ABOVE `worker`, not beside it. Until the Postgres store lands there
# is no separate worker process to hand off to — the in-memory store cannot be
# shared across processes — so the API enqueues and then drives run_job itself as
# a background task. Declaring them siblings would describe an architecture that
# does not exist and force an ignore_import for the one edge that does.
#
# The dependency points the right way regardless: api -> worker, never the
# reverse. When the worker becomes its own process this tightens back to
# "api | worker" and the only edge that must disappear is the one named here.
[[tool.importlinter.contracts]]
name = "layered architecture"
type = "layers"
layers = ["api", "worker", "orchestration", "stages", "pedagogy", "core", "contracts"]
