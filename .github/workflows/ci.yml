name: CI

# Runs on every push and PR. `backend` is the gate `make check` already
# defines locally (schema drift, ruff, import-linter boundaries, pytest) —
# LLM_PROFILE=ci routes every model call through the replay adapter, so this
# job makes no network call and needs no key. `docker` proves the image in
# ./Dockerfile actually builds; it never pushes anywhere.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLM_PROFILE: ci

jobs:
  backend:
    name: backend — schema · lint · boundaries · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Create venv (Makefile expects ./.venv) and install
        run: |
          python -m venv .venv
          ./.venv/bin/pip install -q -U pip
          # `api,llm,parsing` cover everything backend/api, backend/core/llm and
          # stage 1 import; `dev` is the test/lint tooling `make check` runs.
          # `openai` and `google-genai` are pinned explicitly because
          # core/llm/client.py:build_adapters constructs OpenRouterAdapter /
          # GeminiAdapter eagerly whenever the matching key is present — even
          # under LLM_PROFILE=ci that constructor path is exercised by
          # backend/tests/unit/test_knowledge_core.py — and neither package is
          # declared in backend/pyproject.toml's `llm` extra. See
          # docs/12-deployment.md "Must-fix before production".
          ./.venv/bin/pip install -q -e "backend[dev,api,llm,parsing]" \
            "openai==2.51.0" "google-genai==2.16.0"

      - name: make check
        run: make check

  frontend:
    name: frontend — lint · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend

      - run: npm run build
        working-directory: frontend

  docker:
    name: docker — build image (no push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: eduforge-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
