# EduForge AI — per-stage model routing.
#
# Model choice is an OPERATOR decision expressed here, never a hardcoded constant
# inside a stage. Stages ask for a `stage` name; the router hands back a ModelSpec.
#
# Select a profile with LLM_PROFILE={production|dev|ci}.
#
#   production — OpenRouter free models. Graded output path and deployed demo.
#   dev        — OpenRouter, smallest model. Single-stage iteration.
#   ci         — replay. Recorded cassettes: deterministic, free, offline.
#
# ─────────────────────────────────────────────────────────────────────────────
# RULE: quality evaluation (M11) runs on `production` only.
#
# Prompt-tuning against one model and shipping another means the eval numbers do
# not transfer — you would be optimising for a model you do not deploy. The eval
# harness refuses to run under any other profile and says why.
# ─────────────────────────────────────────────────────────────────────────────

profiles:

  production:
    # OpenRouter free tier. Model ids were chosen from a live query of
    # /api/v1/models filtered to `:free` AND advertising response_format support —
    # only 5 of the 14 free models do, and a model that cannot honour a schema
    # falls back to prompt-only JSON, which is materially less reliable.
    #
    # Context here is 128k-262k with 32k+ output ceilings, so the tight per-call
    # budgets the previous provider forced are gone. The two-call split in stage 3
    # stays regardless: it is better failure isolation, not just a size workaround.
    default:
      provider: openrouter
      model: nvidia/nemotron-3-super-120b-a12b:free
      max_tokens: 8000
      reasoning: { effort: high }
      cache_prefix: true
    stages:
      # Short judgement over a document sample — the small model is plenty.
      educational-classification: { model: nvidia/nemotron-3-super-120b-a12b:free, max_tokens: 4000 }
      # Everything downstream teaches what extraction produces, and a hallucinated
      # concept propagates through six stages before anyone reads it. Largest
      # free model available.
      knowledge-extraction:  { model: nvidia/nemotron-3-super-120b-a12b:free, max_tokens: 12000 }
      teaching-planner:      { model: nvidia/nemotron-3-super-120b-a12b:free, max_tokens: 10000 }
      lesson-generation:     { model: nvidia/nemotron-3-super-120b-a12b:free, max_tokens: 12000 }
      activity-generation:   { max_tokens: 8000, reasoning: { effort: medium } }
      assessment-generation: { model: nvidia/nemotron-3-super-120b-a12b:free, max_tokens: 10000 }
      gap-analysis:          { max_tokens: 8000, reasoning: { effort: medium } }
      # Validation is a judge, not an author, and only sees the ambiguous middle
      # band of claims the lexical pre-filter could not settle.
      validation:            { model: openai/gpt-oss-20b:free, max_tokens: 4000,
                               reasoning: { effort: low } }

  # Anthropic profile is defined but NOT selected anywhere. Running it also
  # requires ALLOW_ANTHROPIC=true; a key in the environment is not sufficient.
  anthropic:
    default:
      provider: anthropic
      model: claude-opus-5
      max_tokens: 16000
      reasoning: { effort: high }
      cache_prefix: true
    stages:
      educational-classification: { max_tokens: 4000, reasoning: { effort: medium } }
      validation:                 { max_tokens: 4000, reasoning: { effort: low } }

  local:
    # Open-weight models on this machine, through Ollama. No key, no quota, no
    # network — which is the entire reason it exists. A hosted free tier is
    # generous until the day it is not, and "the demo could not run because a
    # daily limit resets at midnight UTC" is a bad answer to give anyone.
    #
    # It buys that with latency. CPU inference is one to two orders of magnitude
    # slower than a hosted GPU, so `max_tokens` here is a fraction of the
    # production values: on a CPU every output token is paid for in seconds, and
    # a 12,000-token ceiling that a hosted model fills in 20s takes tens of
    # minutes locally. Smaller budgets keep a full run finishable.
    #
    # Use this to prove the pipeline runs end to end and to develop without
    # burning quota. Do NOT read pedagogical quality off it — a 4B model on a
    # laptop is not what the production profile ships.
    default:
      provider: ollama
      model: qwen3:4b
      max_tokens: 2000
      cache_prefix: false
    stages:
      # A short judgement over a document sample; the smallest budget that can
      # still return the full classification object.
      educational-classification: { max_tokens: 1200 }
      # Everything downstream teaches what extraction produces, so it keeps the
      # largest local budget that still returns in reasonable time.
      knowledge-extraction:  { max_tokens: 3000 }
      teaching-planner:      { max_tokens: 2000 }
      lesson-generation:     { max_tokens: 2500 }
      activity-generation:   { max_tokens: 2000 }
      assessment-generation: { max_tokens: 2000 }
      gap-analysis:          { max_tokens: 2000 }
      # Validation judges the ambiguous middle band of claims only, so it is the
      # one stage whose budget can stay small without losing anything.
      validation:            { max_tokens: 1200 }

  dev:
    # Single-stage iteration on the cheapest capable free model.
    default:
      provider: openrouter
      model: openai/gpt-oss-20b:free
      max_tokens: 6000
      reasoning: { effort: medium }
    stages:
      validation: { max_tokens: 3000, reasoning: { effort: low } }

  gemini_dev:
    # Cheap plumbing iteration. Expect noticeably weaker pedagogical output —
    # that is fine here, because this profile is for verifying that stages wire
    # together, not for judging content quality.
    #
    # Flash everywhere on purpose. gemini-2.5-pro reports `limit: 0` on the free
    # tier — it is not throttled, it is unavailable — so routing the heavy stages
    # to it fails outright rather than running slowly. If you are on a paid tier,
    # promoting knowledge-extraction and lesson-generation to pro is worthwhile.
    default:
      provider: gemini
      model: gemini-2.5-flash
      max_tokens: 16000
      reasoning: { effort: medium }
      cache_prefix: true
    stages:
      knowledge-extraction: { reasoning: { effort: high } }
      teaching-planner:     { reasoning: { effort: high } }
      lesson-generation:    { reasoning: { effort: high } }
      validation:           { max_tokens: 4000, reasoning: { effort: low } }

  ci:
    # Serves recorded responses from tests/fixtures/llm_cassettes keyed by a hash
    # of (stage, model, prompt). A cache miss is a hard failure, never a live
    # call — CI must not depend on a network or a key.
    default:
      provider: replay
      model: cassette
      max_tokens: 16000

# Stages absent from a profile's `stages` map inherit that profile's `default`.
# Fields absent from a stage entry inherit the default's value for that field.
