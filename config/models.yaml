# EduForge AI — per-stage model routing.
#
# Model choice is an OPERATOR decision expressed here, never a hardcoded constant
# inside a stage. Stages ask for a `stage` name; the router hands back a ModelSpec.
#
# Select a profile with LLM_PROFILE={production|dev|ci}.
#
#   production — Anthropic. The graded output path and the deployed demo.
#   dev        — Gemini. Cheap iteration while wiring plumbing.
#   ci         — replay. Recorded cassettes: deterministic, free, offline.
#
# ─────────────────────────────────────────────────────────────────────────────
# RULE: quality evaluation (M11) runs on `production` only.
#
# Prompt-tuning against one model and shipping another means the eval numbers do
# not transfer — you would be optimising for a model you do not deploy. The eval
# harness refuses to run under any other profile and says why.
# ─────────────────────────────────────────────────────────────────────────────

profiles:

  production:
    # Groq. Fast, and the free tier is generous enough to run all ten stages
    # repeatedly — which matters more than it sounds: a pipeline you cannot
    # afford to run end to end is one whose integration bugs surface during the
    # demo rather than during development.
    #
    # TWO HARD FREE-TIER CONSTRAINTS, both measured rather than assumed:
    #
    # 1. TPM is 8000 and `max_tokens` counts against it as *reserved* budget, not
    #    as measured usage. The real ceiling is `prompt + max_tokens <= 8000`, so
    #    a 16k max_tokens fails with a 413 before the model ever runs.
    #
    # 2. That same 8000 is a per-minute throughput budget. gpt-oss-120b needed
    #    ~7.7k tokens per extraction call, which is barely one call per minute and
    #    made a full run mostly waiting. 20b at ~4.6k roughly doubles throughput
    #    for a modest quality cost, which is the right trade for a profile whose
    #    job is proving the pipeline runs end to end.
    #
    # On a paid tier, promote extraction / planning / lesson-generation to
    # gpt-oss-120b and roughly quadruple every max_tokens below.
    default:
      provider: groq
      model: openai/gpt-oss-20b
      max_tokens: 3500
      reasoning: { effort: high }
      cache_prefix: true
    stages:
      # Cheap: a short judgement over a sample of the document.
      educational-classification: { max_tokens: 2500, reasoning: { effort: medium } }
      # Everything downstream teaches what extraction produces, so it gets the
      # largest budget that still fits the ceiling. Map-reduce keeps long
      # documents inside it, so the limit constrains breadth per call rather than
      # total coverage.
      knowledge-extraction:  { max_tokens: 4000 }
      teaching-planner:      { max_tokens: 3500 }
      lesson-generation:     { max_tokens: 4000 }
      activity-generation:   { max_tokens: 3000, reasoning: { effort: medium } }
      assessment-generation: { max_tokens: 3500 }
      gap-analysis:          { max_tokens: 3000, reasoning: { effort: medium } }
      # Validation is a judge, not an author, and it only sees the ambiguous
      # middle band of claims the lexical pre-filter could not settle.
      validation:            { max_tokens: 2500, reasoning: { effort: low } }

  # Anthropic profile is defined but NOT selected anywhere. Running it also
  # requires ALLOW_ANTHROPIC=true; a key in the environment is not sufficient.
  anthropic:
    default:
      provider: anthropic
      model: claude-opus-5
      max_tokens: 16000
      reasoning: { effort: high }
      cache_prefix: true
    stages:
      educational-classification: { max_tokens: 4000, reasoning: { effort: medium } }
      validation:                 { max_tokens: 4000, reasoning: { effort: low } }

  dev:
    # Cheap plumbing iteration. Expect noticeably weaker pedagogical output —
    # that is fine here, because this profile is for verifying that stages wire
    # together, not for judging content quality.
    #
    # Flash everywhere on purpose. gemini-2.5-pro reports `limit: 0` on the free
    # tier — it is not throttled, it is unavailable — so routing the heavy stages
    # to it fails outright rather than running slowly. If you are on a paid tier,
    # promoting knowledge-extraction and lesson-generation to pro is worthwhile.
    default:
      provider: gemini
      model: gemini-2.5-flash
      max_tokens: 16000
      reasoning: { effort: medium }
      cache_prefix: true
    stages:
      knowledge-extraction: { reasoning: { effort: high } }
      teaching-planner:     { reasoning: { effort: high } }
      lesson-generation:    { reasoning: { effort: high } }
      validation:           { max_tokens: 4000, reasoning: { effort: low } }

  ci:
    # Serves recorded responses from tests/fixtures/llm_cassettes keyed by a hash
    # of (stage, model, prompt). A cache miss is a hard failure, never a live
    # call — CI must not depend on a network or a key.
    default:
      provider: replay
      model: cassette
      max_tokens: 16000

# Stages absent from a profile's `stages` map inherit that profile's `default`.
# Fields absent from a stage entry inherit the default's value for that field.
